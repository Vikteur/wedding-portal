# Datasource: PostgreSQL only, in every profile.
quarkus.datasource.db-kind=postgresql
# Dev Services starts this image when no JDBC URL is configured (dev and test).
quarkus.datasource.devservices.image-name=postgres:17-alpine

# Flyway owns the schema, from wedding-portal's own empty V1 baseline.
# No baseline-on-migrate: a database that holds tables but no history is refused, never adopted.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=false

# Hibernate only checks the schema Flyway built; it never creates or changes it.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC

# Dev: one reusable PostgreSQL container named wedding_portal.
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.reuse=true
%dev.quarkus.datasource.devservices.db-name=wedding_portal

# Test: a fresh container per run.
%test.quarkus.datasource.devservices.reuse=false

# Prod: the connection comes from the environment only. No default URL, no default password.
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Request bodies up to 10240K are accepted; larger ones are refused with 413 (same limit as rekord-api).
quarkus.http.limits.max-body-size=10240K
