# Pseudonymized EXAMPLE excerpt of the shared OpenAPI contract — one tag slice, not the full spec.
# Shows the house style (tags, operationIds, $ref'd header parameters, examples, notification errors)
# in the fictional "shop" world used by the rest of this folder.
openapi: 3.0.3
info:
  title: Shop
  description: Shop Backend API
  version: 1.0.0
  contact:
    name: Shop team
    email: shop-team@example.com
servers:
  - url: http://localhost:8081
  - url: https://shop.dev.example.com
  - url: https://shop.example.com
security:
  - token: []
tags:
  - name: Order
    description: All actions and information for Order
  - name: OrderCategoriesAdmin
    description: Load order categories
paths:
  /api/orders:
    get:
      tags:
        - Order
      summary: Get orders
      description: The requested orders for the authenticated customer
      operationId: getOrders
      parameters:
        - $ref: '#/components/parameters/contextHeader'
        - $ref: '#/components/parameters/acceptLanguage'
        - in: query
          name: sinceLastVisit
          description: Get orders since last visit
          schema:
            type: boolean
        - in: query
          name: legacy
          description: return orders from the legacy datasource
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: All orders for the authenticated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orders'
              examples:
                orders:
                  value:
                    - code:
                        value: '5410000000017'
                        type: 'EAN'
                      description: 'Espresso machine'
                      orderDate: '2022-08-24'
                      type: 'APPLIANCE'
                    - code:
                        value: 'KIT/COF001'
                        type: 'SKU'
                      description: 'Coffee subscription'
                      orderDate: '2022-01-24'
                      endDate: '2022-08-24'
                      countryCode: 'NL'
                      type: 'SUBSCRIPTION'
                noOrders:
                  value: []
        '401':
          description: Not authorized
  /api/admin/order-categories:
    post:
      tags:
        - OrderCategoriesAdmin
      summary: Load order categories
      description: Load order categories
      operationId: loadOrderCategories
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Order categories loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notification'
        '400':
          description: Bad CSV file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notification'
components:
  securitySchemes:
    token:
      type: apiKey
      description: Session token issued by the identity provider
      name: SHOP_TOKEN
      in: header
  parameters:
    contextHeader:
      in: header
      name: X-context
      description: retrieve user context source
      required: true
      schema:
        $ref: '#/components/schemas/contextEnum'
    acceptLanguage:
      name: X-Accept-Language
      in: header
      description: Accept-Language header that does not interfere with operating system or browser Accept-Language
      required: true
      schema:
        type: string
        enum: [nl, fr, en, de]
        default: en
  schemas:
    contextEnum:
      type: string
      enum: [PAGE, HOME]
    notification:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
    orders:
      description: List of orders
      type: array
      items:
        $ref: '#/components/schemas/order'
    order:
      description: Describes one order
      type: object
      required: ['orderDate', 'type']
      properties:
        code:
          $ref: '#/components/schemas/orderCode'
        description:
          type: string
        orderDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        countryCode:
          type: string
        type:
          type: string
        category:
          type: string
        seller:
          type: string
        fulfiller:
          type: string
        fulfilmentCountry:
          type: string
        notes:
          type: array
          items:
            type: string
    orderCode:
      type: object
      properties:
        value:
          type: string
        type:
          type: string
