name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the pinned contract ref
        id: contract-pin
        run: bash .github/scripts/contract-pin.sh gradle.properties

      - name: Check out rekord-contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Vikteur/rekord-contract
          ref: ${{ steps.contract-pin.outputs.ref }}
          path: contract
          token: ${{ secrets.CONTRACT_TOKEN }}

      - name: Contract token is read-only
        run: bash .github/scripts/contract-read-only-check.sh contract

      - name: Contract is exactly the pinned ref
        run: bash .github/scripts/contract-ref-check.sh contract "${{ steps.contract-pin.outputs.kind }}" "${{ steps.contract-pin.outputs.pin }}"

      - name: Contract bundle present
        run: test -f contract/dist/openapi.yaml

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build and test
        id: gradle
        run: ./gradlew test integrationTest build --stacktrace -Pcontract.spec=contract/dist/openapi.yaml

      - name: Required tasks exist
        run: |
          ./gradlew -q help --task test
          ./gradlew -q help --task integrationTest
          ./gradlew -q help --task build
          ./gradlew -q :application:help --task quarkusBuild

      - name: Fast-jar built
        run: >
          test -f application/build/quarkus-app/quarkus-run.jar
          && test -d application/build/quarkus-app/lib
          && test -d application/build/quarkus-app/app
          && test -d application/build/quarkus-app/quarkus

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the Groma CLI
        run: npm install -g groma.md@0.6.6

      - name: Groma architecture map is curated and in sync
        run: bash .github/scripts/groma-check.sh

      - name: Upload test reports
        if: failure() && steps.gradle.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: "**/build/reports/tests/**"

      - name: Contract pin is a tag (required to merge)
        run: bash .github/scripts/contract-pin-merge-check.sh "${{ steps.contract-pin.outputs.kind }}"

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the pinned contract ref
        id: contract-pin
        run: bash .github/scripts/contract-pin.sh gradle.properties

      - name: Check out rekord-contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Vikteur/rekord-contract
          ref: ${{ steps.contract-pin.outputs.ref }}
          path: contract
          token: ${{ secrets.CONTRACT_TOKEN }}

      - name: Contract token is read-only
        run: bash .github/scripts/contract-read-only-check.sh contract

      - name: Contract is exactly the pinned ref
        run: bash .github/scripts/contract-ref-check.sh contract "${{ steps.contract-pin.outputs.kind }}" "${{ steps.contract-pin.outputs.pin }}"

      - name: Contract bundle present
        run: test -f contract/dist/openapi.yaml

      - name: Build image
        run: docker build -t wedding-portal:ci .

      - name: Check image
        run: bash .github/scripts/image-check.sh wedding-portal:ci
