name: CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Required tasks exist
        run: |
          ./gradlew -q help --task test
          ./gradlew -q help --task integrationTest
          ./gradlew -q help --task build
          ./gradlew -q :application:help --task quarkusBuild

      - name: Fast-jar built
        run: test -f application/build/quarkus-app/quarkus-run.jar && test -d application/build/quarkus-app/lib

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
