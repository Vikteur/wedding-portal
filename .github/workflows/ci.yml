name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the Groma CLI
        run: npm install -g groma.md@0.6.6

      - name: Groma architecture map is curated and in sync
        run: bash .github/scripts/groma-check.sh

      - name: Pre-push hook stops a push the map check rejects
        run: bash scripts/test/pre-push.test.sh
