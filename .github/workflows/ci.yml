name: CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Required tasks exist
        run: |
          ./gradlew -q help --task test
          ./gradlew -q help --task integrationTest
          ./gradlew -q help --task build
          ./gradlew -q :application:help --task quarkusBuild

      - name: Fast-jar built
        run: >
          test -f application/build/quarkus-app/quarkus-run.jar
          && test -d application/build/quarkus-app/lib
          && test -d application/build/quarkus-app/app
          && test -d application/build/quarkus-app/quarkus

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: "**/build/reports/tests/**"

  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image
        run: docker build -t wedding-portal:ci .

      - name: Check image
        run: bash .github/scripts/image-check.sh wedding-portal:ci
