name: build-feature
description: |
  Use when: building one Backlog ticket (name its TASK-n) or one small request, end to end in this repo.
  Steps: read the ticket -> plan -> STOP approval when the ticket or the plan touches the STOP list -> per step, the test
  agent writes failing tests, then the build agent makes them pass -> review -> test-first check -> fold a fresh
  Groma scan into the architecture map, curate what it added, and link the ticket to the map elements it changed
  (repos with groma/ only) -> push and open a DRAFT pull request -> wait for CI by commit SHA, fix a red run (at most 3 rounds) -> mark it ready for your merge ->
  wait for your merge, which is the review and the STOP approval -> finalize the Backlog ticket (Done) -> commit and
  push the Backlog ticket, and delete the run's branch and worktree. The retro (lessons learned and the ticket's ADRs)
  is not part of this workflow: it is launched separately, after the pull request is merged (see docs/retro/README.md).
  NOT for: contract (spec) changes in the hub repo, or work spanning several tickets.
interactive: true

# Model policy (UD-21.a, amended by UD-21.f): @analyse (Claude Opus 5.5) plans, reviews and diagnoses; @build (Claude
# Sonnet 5.5) writes code, tests and the pull request text. The review node may commit test-first fixes for its own
# findings. Every commit trailer names the model that wrote the commit. Both aliases are defined in .archon/config.yaml.
# Deterministic steps are scripts in .archon/scripts (P2): reading the ticket, routing the STOP gate, the push, CI by SHA.
nodes:
  - id: ticket
    bash: |
      bash .archon/scripts/ticket.sh "$ARGUMENTS"
    output_format:
      type: object
      properties:
        task: { type: string }
        stop: { type: string }
      required: [task, stop]

  - id: plan
    depends_on: [ticket]
    model: "@analyse"
    prompt: |
      Request: $ARGUMENTS
      Backlog ticket: $ticket.output.task. Read its full text in $ARTIFACTS_DIR/ticket.md first (it is there when the
      request names one); never search the disk for it.
      Explore the codebase and write an implementation plan for exactly this request to $ARTIFACTS_DIR/plan.md.
      Copy every literal input the ticket gives (values, names, messages, paths, limits) into the step that uses it, word
      for word: the build agents read the plan, not the ticket.
      Trace every path that writes what a step changes (each caller, each node, each script), not only the first one.
      When a step relies on a tool's default (a flag, an exit code, a format), run the tool once and write what it
      actually does into the step.
      Name only workflow nodes that exist in .archon/workflows/build-feature.yaml.
      When the ticket names a guard or a gate, list up front everything it must refuse, each with the test that
      proves the refusal.
      Add a `## Decisions → tests` table: every owner decision, STOP option and acceptance criterion in the ticket,
      with the test that fails without it. A row with no test is a gap in the plan.
      Write every step as a Markdown checkbox line `- [ ] ...`; each step names the tests that are written first and fail
      until the step is built (tests first, always). Fold a docs-only change into the step it documents.
      A step that adds no behaviour (it only runs checks, or only reads or updates docs) cannot have a failing test:
      write it as `- [ ] (verify only) ...`. A step that only adds tests for behaviour that already exists (it pins the
      behaviour) is `- [ ] (pin only) ...`: its tests are proven by a mutation that turns them red.
      Plan only code, tests and local commits: the push, the pull request and reading CI are later nodes of this
      workflow, so never write them as a checkbox step.
      Then decide whether the plan touches the STOP list of .claude/CLAUDE.md (a contract push, a database migration,
      authentication or authorization, encryption or what gets logged, deleting branches or history, production
      configuration or secrets). Answer stop=true with the item in stop_reason, or stop=false with an empty reason.
    output_format:
      type: object
      properties:
        stop: { type: boolean }
        stop_reason: { type: string }
      required: [stop, stop_reason]

  - id: stop-route
    depends_on: [plan]
    bash: |
      labels=$ticket.output.stop
      planned=$plan.output.stop
      reason=$plan.output.stop_reason
      why=""
      [ -n "$labels" ] && why="ticket labels: $labels"
      [ "$planned" = "true" ] && why="${why:+$why; }plan: $reason"
      pause=false; [ -n "$why" ] && pause=true
      node -e 'console.log(JSON.stringify({ pause: process.argv[1] === "true", why: process.argv[2] }))' "$pause" "$why"
    output_format:
      type: object
      properties:
        pause: { type: boolean }
        why: { type: string }
      required: [pause, why]

  - id: stop-gate
    depends_on: [stop-route]
    when: "$stop-route.output.pause == 'true'"
    approval:
      decisions:
        - { id: approve, label: "Implement the plan" }
        - { id: reject, label: "End the run here" }
      message: |
        STOP: $stop-route.output.why
        Read the plan in $ARTIFACTS_DIR/plan.md before any code is written. Approve to implement it, reject to end
        the run here. With your answer, write one line per decision you take: `Decision: <option> (<why>)`, and
        name yourself when you decide for the owner (`by: <name>`). The run records your words in the plan.

  # The STOP answer goes on record before any code (P2): a script writes the gate's text into plan.md under
  # `## Owner decisions`, so the build agents, the review and the pull request read the same decision. A reject ends the run.
  - id: decision-record
    depends_on: [stop-gate]
    bash: |
      decision=$stop-gate.output.decision
      text=$stop-gate.output.text
      bash .archon/scripts/decision-record.sh "$ARTIFACTS_DIR/plan.md" "$decision" "$text"

  # Tests first, always (TDD): per plan step the test agent writes the failing tests and commits them alone, then the
  # build agent writes the code that makes them pass. tdd-check proves the order before anything is pushed.
  # The loop also ends on a `BLOCKED:` line in plan.md: a build agent writes it instead of asking a question nobody
  # can answer mid-loop, and the run fails visibly instead of spinning to max_iterations.
  - id: implement
    depends_on: [stop-route, decision-record]
    trigger_rule: none_failed_min_one_success
    loop_group:
      max_iterations: 10
      until_bash: |
        grep -qE '^BLOCKED:' "$ARTIFACTS_DIR/plan.md" || ! grep -qE '^\s*- \[ \]' "$ARTIFACTS_DIR/plan.md"
      nodes:
        - id: write-tests
          model: "@build"
          prompt: |
            Request: $ARGUMENTS
            You are the test agent: you write tests, never production code.
            Read $ARTIFACTS_DIR/plan.md and take the first step still marked `- [ ]`; n is its position among the
            plan's checkbox lines (the first checkbox is 1).
            A step that pushes, opens the pull request or reads CI is done by later nodes of this workflow: write
            nothing for it and stop.
            A step marked `- [ ] (verify only)` adds no behaviour: write nothing for it and stop.
            A step marked `- [ ] (pin only)` pins behaviour that exists: write its tests, then break the code once (remove
            the guard or flip the condition the test pins), run the tests, save that red output to
            $ARTIFACTS_DIR/red/step-<n>.log with a first line `MUTATION: <file>: <what you broke>`, and revert the code
            from git, that file only. Commit only the tests.
            Otherwise write the tests the step names, and only tests: they state the behaviour the step adds, so they
            must fail now because that behaviour is missing (a compile error for a class the step creates counts).
            Run them and save the full output to $ARTIFACTS_DIR/red/step-<n>.log. The red log must show only the missing
            behaviour: a failure to resolve a dependency, or a compile error outside the types this step creates, proves
            nothing, so fix the build and run again. If they pass already, they do not test the step: rewrite them.
            Commit the tests alone as `test(step <n>): <what they prove>`, ending the message with the trailer
            `Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>`.
            When you cannot go on without an answer, write one line `BLOCKED: <question>` at the end of the plan and
            stop. Otherwise do not edit the plan.
        - id: build-step
          depends_on: [write-tests]
          model: "@build"
          prompt: |
            Request: $ARGUMENTS
            Read $ARTIFACTS_DIR/plan.md and take the first step still marked `- [ ]`.
            A step that pushes, opens the pull request or reads CI is done by later nodes of this workflow: do not do
            it, mark it `- [x] (done by the workflow's open-pr and ci nodes)` and commit nothing for it.
            A step marked `- [ ] (verify only)` has no tests: run the checks the step names, fix nothing but docs,
            commit only the docs that changed (if any), and mark it `- [x] (verify only) ...`.
            A step marked `- [ ] (pin only)` has its tests committed: run the whole suite, mark it `- [x] (pin only) ...`
            and commit nothing else.
            Otherwise the test agent has committed this step's failing tests. Write the code that makes them pass,
            without weakening them; when a test is wrong, fix it in the same commit and give the reason on a line
            `Test fix: <why>` in the message (tdd-check reports a test edit without one). Run the whole test suite. When
            it passes, mark the step `- [x]` in the plan and commit the code, ending the message with the trailer
            `Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>`.
            When you cannot go on without an answer, write one line `BLOCKED: <question>` at the end of the plan and
            stop.

  - id: review
    depends_on: [implement]
    model: "@analyse"
    prompt: |
      Request: $ARGUMENTS
      Review all changes on this branch against $ARTIFACTS_DIR/plan.md, including that every behaviour has a test.
      A green suite is not the verdict; check each of these and treat a miss as an issue:
      - Mutations: remove each guard line the branch adds once, flip each new condition, shift each boundary by one, and
        run the tests. A change no test catches is an issue. Revert each mutation from git, file by file.
      - Claims: every comment, javadoc, doc line and the plan's own claims match what the code does. A claim stronger
        than the code is an issue: fix the code or narrow the claim.
      - Decisions: every row of `## Decisions → tests` and every line under `## Owner decisions` in the plan has a test
        that fails without it.
      - Write paths: every path that writes what the branch changes is covered, not only the one the plan traced.
      - Gates: a gate or a guard the branch adds fails closed when its input is missing or empty.
      Fix every issue tests first: commit the test that shows the issue alone, then the fix (UD-21.f). End each commit
      message with the trailer `Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>`. Run the tests.

  # Deterministic test-first gate (P2): every built step has a red run, and every code commit follows a test commit.
  # The checked HEAD is kept, so `ready` checks again over the commits that came after (review and CI fixes).
  - id: tdd-check
    depends_on: [review]
    bash: |
      set -e
      bash .archon/scripts/tdd-check.sh "$ARTIFACTS_DIR" "$BASE_BRANCH"
      git rev-parse HEAD > "$ARTIFACTS_DIR/tdd-checked.sha"

  # The Groma architecture map (TASK-36), in a repo with groma/ only: a script commits a fresh scan; the model curates
  # only what that scan added and the repo's groma-check.sh still rejects. CI runs the same check, so it gates the merge.
  - id: map-scan
    depends_on: [tdd-check]
    bash: |
      bash .archon/scripts/groma-sync.sh
    output_format:
      type: object
      properties:
        curate: { type: boolean }
      required: [curate]

  - id: map-curate
    depends_on: [map-scan]
    when: "$map-scan.output.curate == 'true'"
    model: "@analyse"
    prompt: |
      Request: $ARGUMENTS
      This branch changed the code, and a fresh Groma scan (already committed) put elements into the architecture map
      under groma/ that `bash .github/scripts/groma-check.sh` rejects; run it to see which. Run `groma agent-instructions`
      and read the guides it names for structure, descriptions and relationships. Change groma/ only through the groma
      CLI, never by editing its files. Place each new element under the container it belongs to; combine it into the
      existing component with the same responsibility, or keep it as a component when its responsibility is new.
      Describe what is new or changed, and add relationships only where the source supports them. Leave the rest of the
      map as it is. Run the check again until it passes, then commit groma/ alone as `docs(groma): <what changed>`.

  - id: map-check
    depends_on: [map-scan, map-curate]
    trigger_rule: none_failed_min_one_success
    bash: |
      if [ -f .github/scripts/groma-check.sh ]; then bash .github/scripts/groma-check.sh; fi

  # Link the ticket to the map (TASK-36): its changed files and the elements that own them, so Groma shows the ticket on
  # the map while it is open. A container the ticket was planned on is dropped once a component under it is linked
  # (`dropped` lists those ids). The ticket is edited in the umbrella checkout; close-out commits it with the ticket's Done.
  - id: map-links
    depends_on: [map-check]
    bash: |
      task=$ticket.output.task
      bash .archon/scripts/groma-links.sh "$task" "$BASE_BRANCH"
    output_format:
      type: object
      properties:
        files: { type: number }
        refs: { type: string }
        dropped: { type: string }
      required: [files, refs]

  # Merge the base into the branch before the pull request opens (TASK-45): parallel tickets append to the same files,
  # and a conflicting pull request gets no CI. docs/memory.md merges as a union; any other conflict fails the run here.
  - id: merge-main
    depends_on: [map-links]
    bash: |
      bash .archon/scripts/merge-main.sh "$BASE_BRANCH"
    output_format:
      type: object
      properties:
        merged: { type: boolean }
        pushed: { type: boolean }
      required: [merged, pushed]

  # No review gate before the push: the user reviews and merges the pull request, which is the human approval.
  - id: pr-text
    depends_on: [merge-main]
    model: "@build"
    prompt: |
      Request: $ARGUMENTS
      Write the pull request description for the changes on this branch to $ARTIFACTS_DIR/pr-body.md: what changed
      and why, the tests, and the Backlog ticket ($ticket.output.task) when there is one. When the plan has a
      `## Owner decisions` section, copy it into a section `## Decisions` word for word, each with who decided it
      (the owner, or the coordinator acting for the owner); never credit a decision to someone the record does not
      name. Leave a line `<!-- pr-refresh:start -->`, then `<!-- pr-refresh:end -->`, before `## Approval`: a
      script fills that block from the branch after every CI round. Then add a section
      `## Approval` saying that merging this pull request records the human review and the approval of the STOP
      items, and name those items: "$stop-route.output.why" (when that is empty, say that the ticket touches no STOP
      item and the merge records the review). End it with:

      🤖 Generated with [Claude Code](https://claude.com/claude-code)
      Do not push and do not open the pull request; return only the title.
    output_format:
      type: object
      properties:
        title: { type: string }
      required: [title]

  - id: open-pr
    depends_on: [pr-text]
    bash: |
      title=$pr-text.output.title
      bash .archon/scripts/open-pr.sh "$BASE_BRANCH" "$title" "$ARTIFACTS_DIR/pr-body.md"
    output_format:
      type: object
      properties:
        pr: { type: string }
        sha: { type: string }
      required: [pr, sha]

  - id: ci
    depends_on: [open-pr]
    timeout: 3600000
    bash: |
      bash .archon/scripts/ci-by-sha.sh
    output_format: &ci_state
      type: object
      properties:
        state: { type: string, enum: [green, red, none, conflict] }
        sha: { type: string }
        detail: { type: string }
      required: [state, sha, detail]

  # Red => escalate to the debugger (P5): Opus diagnoses from the failing logs, Sonnet fixes, until CI on the new
  # HEAD is green. Exhausting the rounds fails the run; the pull request stays a draft.
  - id: ci-fix
    depends_on: [ci]
    when: "$ci.output.state == 'red'"
    loop_group:
      max_iterations: 3
      until_bash: bash .archon/scripts/ci-by-sha.sh --check
      nodes:
        - id: diagnose
          model: "@analyse"
          prompt: |
            CI is red for the HEAD commit of this branch. Find the failing runs with
            `gh run list --commit $(git rev-parse HEAD)` and read them with `gh run view <id> --log-failed`.
            Write the root cause and the smallest fix to $ARTIFACTS_DIR/ci-diagnosis.md. Do not edit code.
        - id: fix
          depends_on: [diagnose]
          model: "@build"
          prompt: |
            Read $ARTIFACTS_DIR/ci-diagnosis.md and apply the fix, tests first: when the fix changes behaviour, commit
            the test that shows the failure alone, then the fix. Run the tests, commit, and `git push`.

  # Green CI by SHA marks the pull request ready for your merge. The merge is the human review and the STOP approval
  # (UD-21.e): the run asks for no approval comment. A pull request that conflicts with its base (main moved while CI
  # ran) gets the base merged in and CI asked again. Before the pull request turns ready, the test-first gate runs again
  # over the commits since its first pass (review fixes, CI fixes), and the generated block of the body is refreshed.
  - id: ready
    depends_on: [ci, ci-fix]
    trigger_rule: none_failed_min_one_success
    timeout: 3600000
    bash: |
      set -euo pipefail
      pr=$open-pr.output.pr
      result=$(bash .archon/scripts/ci-by-sha.sh)
      case "$result" in
        *'"state": "conflict"'*)
          echo "$result"
          bash .archon/scripts/merge-main.sh "$BASE_BRANCH"
          result=$(bash .archon/scripts/ci-by-sha.sh) ;;
      esac
      echo "$result"
      case "$result" in
        *'"state": "green"'*)
          bash .archon/scripts/tdd-check.sh "$ARTIFACTS_DIR" "$BASE_BRANCH" --since "$(cat "$ARTIFACTS_DIR/tdd-checked.sha")"
          ARTIFACTS_DIR="$ARTIFACTS_DIR" bash .archon/scripts/pr-refresh.sh "$pr" "$BASE_BRANCH" "$ARTIFACTS_DIR/pr-body.md"
          gh pr ready "$pr" ;;
        *'"state": "conflict"'*) echo "The pull request still conflicts with $BASE_BRANCH: resolve it by hand." >&2; exit 1 ;;
        *'"state": "none"'*) echo "No CI run for this commit: the pull request stays a draft (P5)." >&2; exit 1 ;;
        *) echo "CI is not green: the pull request stays a draft." >&2; exit 1 ;;
      esac

  # After `ready` the run waits for your merge. The merge is the human approval for closing the ticket out (UD-21.c):
  # finalize it in Backlog, commit and push its Backlog files, delete the run's own branch and worktree. A pull request
  # closed without a merge ends the run here; a merge whose head SHA is not green fails it before anything changes.
  # If the run dies while waiting, `archon workflow resume <run-id>` picks the wait up again.
  - id: merged
    depends_on: [ready]
    timeout: 1209600000
    bash: |
      pr=$open-pr.output.pr
      bash .archon/scripts/wait-merge.sh "$pr"
    output_format:
      type: object
      properties:
        state: { type: string, enum: [merged, closed] }
        merge: { type: string }
        head: { type: string }
        branch: { type: string }
        ci: { type: string }
        backlog: { type: string }
      required: [state, merge, head, branch, ci, backlog]

  # CI on the merge commit itself (post-merge criteria read it), by SHA (P5).
  - id: main-ci
    depends_on: [merged]
    when: "$merged.output.state == 'merged'"
    timeout: 3600000
    bash: |
      merge=$merged.output.merge
      bash .archon/scripts/ci-by-sha.sh "$merge"
    output_format: *ci_state

  # The ticket's modified files come from the merged pull request, never from the model's memory of the run (P2).
  - id: ticket-files
    depends_on: [main-ci]
    bash: |
      task=$ticket.output.task
      pr=$open-pr.output.pr
      home=$merged.output.backlog
      if [ -z "$task" ]; then echo "No ticket: no modified files to set."; exit 0; fi
      bash .archon/scripts/ticket-files.sh "$task" "$pr" "$home"

  - id: finalize
    depends_on: [ticket-files]
    when: "$merged.output.state == 'merged'"
    model: "@analyse"
    prompt: |
      Pull request $open-pr.output.pr was merged as $merged.output.merge; CI on its head $merged.output.head is green.
      CI on the merge commit is $main-ci.output.state ($main-ci.output.detail): cite it for any criterion that holds
      only after the merge, and leave such a criterion unchecked when it is not green. The ticket's modified files
      are already set from the pull request; do not change them.
      Backlog ticket: $ticket.output.task. When it is empty there is no ticket: change nothing and return close=true.
      Otherwise finalize the ticket. Run every backlog command with BACKLOG_CWD=$merged.output.backlog, change Backlog
      only through the backlog CLI, and commit nothing: the close-out node commits.
      1. Read `backlog instructions task-finalization` and `backlog task view <ticket> --plain`.
      2. Check each acceptance criterion and Definition of Done item only on evidence: the merged code and tests,
         and the CI runs of the head SHA (`gh run list --commit <head>`, `gh run view <id> --log`). Check an item
         that does not apply, with its reason in the notes as `DoD #n N/A: <reason>`. The human review and the STOP
         approval are the user's merge of pull request $open-pr.output.pr as $merged.output.merge (UD-21.e): cite it
         for the items on STOP approval and on review.
      3. Append the evidence to the implementation notes, write a final summary naming it (pull request, merge
         commit, CI run and SHA), and set the status Done.
      4. When the ticket has a parent and every sub-ticket of that parent is now Done, close the parent the same way.
      5. When an item has no evidence, leave it unchecked and the status unchanged, explain it in the notes, and
         return close=false: the run stops before anything is committed or deleted.
      Do not create or start follow-up tickets; name them in the notes.
    output_format:
      type: object
      properties:
        close: { type: boolean }
      required: [close]

  # Close-out also writes the ticket's token and cost report and its agent report (tools, skills, instruction files,
  # programs, subagents, tokens per agent) to docs/tokenomics/ and commits them (TASK-41, a script: P2).
  - id: close-out
    depends_on: [finalize]
    when: "$finalize.output.close == 'true'"
    bash: |
      task=$ticket.output.task
      pr=$open-pr.output.pr
      home=$merged.output.backlog
      bash .archon/scripts/close-out.sh "$task" "$pr" "$home"
    output_format:
      type: object
      properties:
        backlog: { type: string }
        branch: { type: string }
        worktree: { type: string }
      required: [backlog, branch, worktree]

  # Whatever happened above (merged, failed, stopped), this run's predecessors are archived next to their tickets under
  # docs/retro/<TASK>/runs/<id8>/ (a script: P2). This run is still running here, so it is archived by the next sweep.
  # Never fails the run: a problem is only a warning.
  - id: archive-runs
    depends_on: [close-out]
    trigger_rule: all_done
    bash: |
      . .archon/scripts/retro-umbrella.sh
      if find_umbrella; then bash .archon/scripts/archive-runs.sh "$umbrella" >&2 || echo "warning: the Archon runs were not archived." >&2; fi
      echo done
